# Rebuilds the live site on Cloudflare Pages so the finders pick up newly published rows,
# and so scholarships whose deadlines have passed drop off. Runs weekly and by hand
# (Actions > Rebuild site > Run workflow) after a reviewer publishes in Supabase.
# The Cloudflare deploy hook is stored in Supabase, not GitHub; the "ops" Edge Function calls it.
name: Rebuild site

on:
  schedule:
    - cron: '41 2 * * 1'   # Mondays 02:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Get a GitHub identity token for Supabase
        id: oidc
        run: |
          t=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sa-global-ops" | jq -r .value)
          echo "::add-mask::$t"
          echo "token=$t" >> "$GITHUB_OUTPUT"
      - name: Ask Supabase to trigger the Cloudflare rebuild
        env:
          OPS_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          out=$(curl -sS -w "\n%{http_code}" -X POST https://kdndxzqxzgnusgvgcqsv.supabase.co/functions/v1/ops \
            -H "Authorization: Bearer $OPS_TOKEN" -H "Content-Type: application/json" -d '{"op":"rebuild"}')
          echo "$out"
          test "$(echo "$out" | tail -1)" = "200"
