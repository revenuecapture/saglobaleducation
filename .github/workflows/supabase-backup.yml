# Weekly backup of the catalogue tables into this private repo, because free
# Supabase projects have no automatic backups. Enquiries (leads) are NOT
# backed up here: personal data stays out of git history. The Google Sheet
# that receives each enquiry is the copy of record for leads.
name: Supabase backup

on:
  schedule:
    - cron: '23 4 * * 0'   # Sundays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export tables
        env:
          SUPABASE_URL: https://kdndxzqxzgnusgvgcqsv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "sa-global-backup"
          git config user.email "actions@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "backup: catalogue $(date -u +%F)"
          git push
